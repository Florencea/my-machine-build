name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: Gatekeeper
    uses: Florencea/vp-actions/.github/workflows/vp-web-ci.yml@v2.0.0
    with:
      # Optional: Command to run before tests (e.g. vp run db:seed for fullstack apps)
      # pre-test-command: ""
      # Optional: Custom build command (default: vp build)
      # build-command: vp build
      # Optional: Run platform compatibility checks on Windows and macOS
      enable-platform-compat: false
